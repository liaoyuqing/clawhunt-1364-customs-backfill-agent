# 模块四：只有内网，不给外网出口
services:
  app:
    image: clawhunt-1364-module4:latest
    network_mode: bridge
    networks:
      - intranet_only
    volumes:
      - /srv/invoice-archive:/srv/invoice-archive
      - /etc/clawhunt:/etc/clawhunt:ro
    environment:
      - CLAWHUNT_1364_RULES=/app/rules
      - CLAWHUNT_1364_ISOLATED=/etc/clawhunt/isolated.yaml
    command: ["python", "-m", "prepublish.check", "--config", "/etc/clawhunt/isolated.yaml"]

networks:
  intranet_only:
    driver: bridge
    internal: true